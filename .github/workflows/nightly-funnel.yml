name: Nightly funnel synthetic
on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kinnso/e2e exec playwright install --with-deps chromium
      - name: Production guide-to-experience smoke
        # Both named specs are read-only navigation, and BOOKING_LIVE stays false so the
        # funnel stops short of Stripe. That is what earns this the remote-target opt-in
        # the shared Playwright config otherwise refuses.
        env:
          E2E_BASE_URL: https://remix-kinnso-web.vercel.app
          E2E_ALLOW_REMOTE_TARGET: '1'
          BOOKING_LIVE: 'false'
        run: pnpm --filter @kinnso/e2e e2e funnel-smoke notfound
      - name: Crawl every sitemap URL
        env:
          BASE_URL: https://remix-kinnso-web.vercel.app
        run: node scripts/crawl-sitemap.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: nightly-funnel-artifacts
          path: |
            apps/e2e/test-results/
            apps/e2e/playwright-report/
